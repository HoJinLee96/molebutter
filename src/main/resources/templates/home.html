<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('홈')}"></head>
<body class="app-layout">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>

<main id="main-content" tabindex="-1" class="page">
    <h1 th:text="'안녕하세요, ' + ${userName} + '님'">안녕하세요</h1>

    <section class="home-group" th:each="group : ${navigationGroups}">
        <h2 th:text="${group.label}">상품 업무</h2>
        <div class="section-grid"><a class="section-card ready" th:each="item : ${group.items}" th:href="@{${item.homePath()}}"><span class="name" th:text="${item.label}">메뉴</span><span class="tag open">열기</span></a></div>
    </section>
</main>

<script th:src="@{/js/api.js}"></script>
</body>
</html>
