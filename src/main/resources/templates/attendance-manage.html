<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('근태 관리')}"></head>
<body class="app-layout attendance-page">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>
<main id="main-content" tabindex="-1" class="page">
    <h1>근태 관리</h1>
    <p id="page-error" class="form-error attendance-message" role="alert" hidden></p>
    <p id="page-success" class="form-success attendance-message" role="status" hidden></p>
    <div class="tabs" role="tablist" aria-label="근태 관리">
        <button id="tab-records" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-records" data-tab="records">전체 기록</button>
        <button id="tab-summary" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-summary" tabindex="-1" data-tab="summary">월별 집계</button>
        <button id="tab-corrections" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-corrections" tabindex="-1" data-tab="corrections">정정 요청</button>
    </div>
    <section id="panel-records" class="panel" role="tabpanel" aria-labelledby="tab-records">
        <form id="records-filter" class="toolbar attendance-filters">
            <div class="field"><label for="records-from">시작일</label><input id="records-from" name="from" type="date" required></div>
            <div class="field"><label for="records-to">종료일</label><input id="records-to" name="to" type="date" required></div>
            <div class="field field--search"><label for="records-q">직원 이름 / 이메일</label><input id="records-q" name="q" maxlength="255" type="search" placeholder="이름 또는 이메일"></div>
            <div class="field field--short"><label for="records-status">근태 상태</label><select id="records-status" name="status"><option value="">전체</option><option value="COMPLETED">퇴근 완료</option><option value="WORKING">근무 중</option><option value="ON_BREAK">휴게 중</option><option value="MISSING">퇴근 누락</option></select></div>
            <button class="btn primary" type="submit">조회</button><button id="records-download" class="btn" type="button">CSV 다운로드</button>
        </form>
        <p id="records-count" class="field-hint" role="status"></p>
        <div class="table-wrap"><table class="data"><thead><tr><th>직원</th><th>계정 상태</th><th>근무일</th><th>근태 상태</th><th>출근</th><th>퇴근</th><th>확정 순근무</th><th>확정 휴게</th><th>상세</th></tr></thead><tbody id="records-body"></tbody></table></div>
        <div id="records-pager" class="pager"></div>
    </section>
    <section id="panel-summary" class="panel" role="tabpanel" aria-labelledby="tab-summary" hidden>
        <form id="summary-filter" class="toolbar attendance-filters">
            <div class="field"><label for="summary-month">집계 월</label><input id="summary-month" name="month" type="month" required></div>
            <div class="field field--search"><label for="summary-q">직원 이름 / 이메일</label><input id="summary-q" name="q" maxlength="255" type="search" placeholder="이름 또는 이메일"></div>
            <button class="btn primary" type="submit">조회</button><button id="summary-download" class="btn" type="button">CSV 다운로드</button>
        </form>
        <p id="summary-count" class="field-hint" role="status"></p>
        <div class="table-wrap"><table class="data"><thead><tr><th>직원</th><th>계정 상태</th><th>기록일</th><th>퇴근 완료일</th><th>확정 순근무</th><th>확정 휴게</th><th>근무 중</th><th>휴게 중</th><th>퇴근 누락</th><th>미확정 합계</th></tr></thead><tbody id="summary-body"></tbody></table></div>
        <div id="summary-pager" class="pager"></div>
    </section>
    <section id="panel-corrections" class="panel" role="tabpanel" aria-labelledby="tab-corrections" hidden>
        <div class="toolbar"><div class="field"><label for="status">처리 상태</label><select id="status"><option value="PENDING">승인 대기</option><option value="APPROVED">승인</option><option value="REJECTED">반려</option><option value="CANCELLED">취소</option><option value="">전체</option></select></div><button id="reload" class="btn small" type="button">새로고침</button></div>
        <div class="table-wrap"><table class="data"><thead><tr><th>직원</th><th>근무일</th><th>요청일</th><th>상태</th><th>상세</th></tr></thead><tbody id="requests-body"></tbody></table></div>
        <div id="requests-pager" class="pager"></div>
    </section>
</main>
<dialog id="record-dialog" class="attendance-dialog" aria-labelledby="record-title">
    <div class="attendance-title"><h2 id="record-title">근태 기록 상세</h2><button class="btn small" type="button" data-close="record-dialog">닫기</button></div>
    <div id="record-detail"></div>
</dialog>
<dialog id="review-dialog" class="attendance-dialog" aria-labelledby="review-title">
    <div class="attendance-title"><h2 id="review-title">정정 요청 검토</h2><button class="btn small" type="button" data-close="review-dialog">닫기</button></div>
    <div id="review-detail"></div>
    <div id="review-actions">
        <div class="field"><label for="review-comment">처리 사유 (반려 시 필수)</label><textarea id="review-comment" maxlength="1000" rows="3"></textarea></div>
        <div class="attendance-actions"><button id="approve" class="btn primary" type="button">승인</button><button id="reject" class="btn" type="button">반려</button></div>
    </div>
    <p id="review-error" class="form-error" role="alert" hidden></p>
</dialog>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/attendance-ui.js}"></script>
<script th:src="@{/js/attendance-manage.js}"></script>
<script th:src="@{/js/attendance-query.js}"></script>
</body>
</html>
