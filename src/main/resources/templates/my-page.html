<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('마이페이지')}"></head>
<body>
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>

<main class="page narrow">
    <h1>마이페이지</h1>
    <p class="sub">내 계정 정보를 확인하고 비밀번호를 변경할 수 있습니다.</p>

    <section class="panel">
        <h2>내 정보</h2>
        <dl class="info-list">
            <div>
                <dt>이름</dt>
                <dd th:text="${me.name}">이름</dd>
            </div>
            <div>
                <dt>이메일</dt>
                <dd th:text="${me.email}">이메일</dd>
            </div>
            <div>
                <dt>역할</dt>
                <dd th:text="${me.role.label}">역할</dd>
            </div>
        </dl>
    </section>

    <section class="panel">
        <h2>비밀번호 변경</h2>
        <form id="pw-form" class="auth-form" novalidate>
            <div class="field">
                <label for="current-password">현재 비밀번호</label>
                <input id="current-password" type="password" autocomplete="current-password" required>
            </div>
            <div class="field">
                <label for="new-password">새 비밀번호</label>
                <input id="new-password" type="password" autocomplete="new-password" required>
                <p class="field-hint">8~64자, 영문자와 숫자를 포함해야 합니다.</p>
            </div>
            <div class="field">
                <label for="new-password-confirm">새 비밀번호 확인</label>
                <input id="new-password-confirm" type="password" autocomplete="new-password" required>
            </div>
            <p id="form-error" class="form-error" hidden></p>
            <p id="form-success" class="form-success" hidden>비밀번호가 변경되었습니다. 다른 기기의 로그인은 곧 만료됩니다.</p>
            <button type="submit" id="change-btn" class="btn primary">비밀번호 변경</button>
        </form>
    </section>
</main>

<script th:src="@{/js/api.js}"></script>
<script th:inline="none">
    document.getElementById('signout-btn').addEventListener('click', async () => {
        try {
            await apiPost('/api/auth/signout');
        } finally {
            location.href = '/signin';
        }
    });

    document.getElementById('pw-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        setError('form-error', null);
        document.getElementById('form-success').hidden = true;

        const newPassword = document.getElementById('new-password').value;
        if (newPassword !== document.getElementById('new-password-confirm').value) {
            setError('form-error', '새 비밀번호가 서로 일치하지 않습니다.');
            return;
        }
        const button = document.getElementById('change-btn');
        button.disabled = true;
        try {
            // 성공 시 서버가 기존 access를 blacklist하고 새 토큰 쿠키를 내려주므로 세션은 그대로 유지된다.
            await apiPost('/api/auth/password/change', {
                currentPassword: document.getElementById('current-password').value,
                newPassword,
            });
            document.getElementById('pw-form').reset();
            document.getElementById('form-success').hidden = false;
        } catch (e) {
            setError('form-error', e.message);
        } finally {
            button.disabled = false;
        }
    });
</script>
</body>
</html>
