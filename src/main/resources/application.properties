spring.application.name=molebutter
# 비밀 설정 로딩. 로컬은 classpath(src/main/resources/application-secret), 배포는 jar 옆 ./application-secret 디렉터리.
spring.config.import=optional:classpath:/application-secret/db.properties,optional:classpath:/application-secret/jwt.properties,optional:classpath:/application-secret/mail.properties,optional:file:./application-secret/db.properties,optional:file:./application-secret/jwt.properties,optional:file:./application-secret/mail.properties

server.port=8081

# 리버스 프록시(X-Forwarded-*) 뒤에서 실제 클라이언트 IP/프로토콜 복원. 내부망 프록시가 보낸 헤더만 신뢰한다.
server.forwarded-headers-strategy=native

# Spring Boot Configuration Processor
spring-boot-configuration-processor=optional

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/molebutter?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.flyway.url=${spring.datasource.url}
spring.flyway.clean-disabled=true
# 스키마는 Flyway(db/migration)가 관리한다. validate는 기동 시 엔티티-스키마 불일치를 즉시 드러내는 안전망.
spring.jpa.hibernate.ddl-auto=validate
# 뷰 렌더링까지 영속성 컨텍스트/커넥션을 붙잡는 OSIV 비활성화. 지연 로딩은 서비스 계층 안에서 끝낸다.
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Auth
# n번 로그인 실패시 계정 상태 Locked로 변경
auth.signin.max-failed-attempts=10
# n번 로그인 실패시 IP 차단
auth.signin.rate-limit-max-attempts=20
# 로그인 시도 rate limit 카운터 윈도우(TTL)
auth.signin.rate-limit-window=10m

# Jwt
# auth.jwt.secret=
auth.jwt.access-ttl=15m
auth.jwt.refresh-ttl=14d
auth.jwt.issuer=molebutter

#Cookie
auth.cookie.access-name=access_token
auth.cookie.refresh-name=refresh_token
auth.cookie.refresh-path=/api/auth
auth.cookie.secure=false

# 가입 이메일 인증
auth.email-verification.code-ttl=5m
auth.email-verification.verified-ttl=30m
auth.email-verification.send-cooldown=60s
auth.email-verification.max-verify-attempts=5

# Mail
# 메일 발송 구현 선택. 새 구현을 추가하면 전용 @Configuration에 @ConditionalOnProperty를 걸고 이 값만 바꾼다.
mail.provider=resend

# Logging
# 저장·회전·삭제 정책은 logback-spring.xml에서 관리한다.

