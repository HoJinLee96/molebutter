<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: common('스마트스토어 상품 편집')}"></head><body class="app-layout">
<link rel="stylesheet" th:href="@{/css/coupang-product-editor.css(v=17)}"><link rel="stylesheet" th:href="@{/css/naver-product-editor.css(v=1)}">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>
<main id="main-content" tabindex="-1" class="page marketplace-editor coupang-product-form naver-product-form">
<div class="marketplace-editor-heading"><div><p id="naver-mode" class="product-meta"></p><h1 id="naver-title">스마트스토어 상품 등록</h1></div><a class="btn" href="/marketplaces" data-naver-exit>목록</a></div>
<nav class="editor-section-nav" aria-label="상품 입력 구역"><a href="#naver-basic">상품 정보</a><a href="#naver-options">가격·옵션</a><a href="#naver-media">이미지</a><a href="#naver-description">상세설명</a><a href="#naver-settings">상품주요정보</a><a href="#naver-certifications">인증정보</a><a href="#naver-filters">검색필터</a><a href="#naver-tags">검색어</a><a href="#naver-notices">상품고시</a><a href="#naver-delivery">배송</a><a href="#naver-returns">반품·교환</a></nav>
<p id="naver-loading" role="status">입력 화면 준비 중…</p><p id="naver-error" class="form-error" role="alert" hidden></p><button id="naver-reload" class="btn" type="button" hidden>다시 조회</button>
<form id="naver-form" novalidate hidden>
<section id="naver-basic" class="panel coupang-form-section"><h2>상품 정보</h2><div id="naver-basic-fields"></div></section>
<section id="naver-options" class="panel coupang-form-section"><h2>가격·옵션</h2><div id="naver-price-fields"></div><div id="naver-option-fields"></div></section>
<section id="naver-media" class="panel coupang-form-section"><h2>대표 이미지·추가 이미지</h2><p class="product-meta">상품의 모든 옵션에서 같은 이미지와 상세설명을 사용합니다.</p><div class="editor-image-controls"><label class="field"><span>공개 이미지 주소 (허용 호스트)</span><input id="naver-image-url" placeholder="https://assets.molebutter.link/..."></label><button type="button" class="btn" id="naver-image-add">주소 추가</button><button type="button" class="btn" id="naver-image-choose">파일 선택</button><input type="file" id="naver-image-file" accept="image/jpeg,image/png" multiple hidden></div><p id="naver-image-error" class="form-error" role="alert" hidden></p><div id="naver-images"></div></section>
<section id="naver-description" class="panel coupang-form-section"><h2>상세설명</h2><label class="field"><span>설명 HTML</span><textarea id="naver-description-input" rows="8"></textarea></label><iframe id="naver-description-preview" title="상세설명 미리보기" sandbox="" referrerpolicy="no-referrer" class="editor-preview"></iframe></section>
<section id="naver-settings" class="panel coupang-form-section"><h2>상품주요정보</h2><div id="naver-settings-fields"></div></section>
<section id="naver-certifications" class="panel coupang-form-section"><h2>인증정보</h2><div id="naver-certification-fields"></div></section>
<section id="naver-filters" class="panel coupang-form-section"><h2>검색필터</h2><div id="naver-filter-fields"></div></section>
<section id="naver-tags" class="panel coupang-form-section"><h2>검색어</h2><label class="field"><span>판매자 검색 태그</span><input id="naver-tag-input" placeholder="쉼표로 구분"></label><p class="product-meta">직접 입력 태그를 사용합니다. 기존 추천 태그 ID는 문구가 유지될 때 보존합니다.</p><div id="naver-tag-fields"></div><div id="naver-seo-fields"></div></section>
<section id="naver-notices" class="panel coupang-form-section"><h2>상품정보제공고시</h2><div id="naver-notice-fields"></div></section>
<section id="naver-delivery" class="panel coupang-form-section"><h2>배송</h2><div id="naver-delivery-fields"></div></section>
<section id="naver-returns" class="panel coupang-form-section"><h2>반품·교환</h2><div id="naver-return-fields"></div></section>
<div id="naver-validation" role="status" tabindex="-1" hidden></div><div class="editor-actions"><button class="btn" type="button" data-naver-exit>취소</button><button id="naver-temporary" class="btn" type="button">임시 저장</button><button id="naver-save" class="btn primary" type="submit">저장</button></div></form>
<section id="naver-results" class="panel" aria-live="polite" hidden></section></main>
<dialog id="naver-save-dialog" class="coupang-address-dialog" aria-labelledby="naver-save-title"><h2 id="naver-save-title">저장 내용 확인</h2><p id="naver-save-dialog-error" class="form-error" role="alert" hidden></p><div id="naver-save-preview"></div><div class="toolbar"><button id="naver-save-close" type="button" class="btn">취소</button><button id="naver-save-confirm" type="button" class="btn primary">스마트스토어에 저장</button></div></dialog>
<dialog id="naver-picker-dialog" class="coupang-address-dialog" aria-labelledby="naver-picker-title"><div class="toolbar"><h2 id="naver-picker-title">선택</h2><button id="naver-picker-close" class="btn" type="button">닫기</button></div><form id="naver-picker-query" class="toolbar"><input id="naver-picker-term" aria-label="검색어"><button type="submit" class="btn primary">검색</button></form><p id="naver-picker-error" class="form-error" role="alert" hidden></p><div id="naver-picker-list"></div><div class="toolbar"><button id="naver-picker-prev" type="button" class="btn" disabled>이전</button><span id="naver-picker-page"></span><button id="naver-picker-next" type="button" class="btn" disabled>다음</button></div></dialog>
<script defer th:src="@{/js/api.js}"></script><script defer th:src="@{/js/marketplace-submissions.js(v=3)}"></script><script defer th:src="@{/js/naver-product-editor-model.js(v=1)}"></script><script defer th:src="@{/js/naver-product-editor-save.js(v=1)}"></script><script defer th:src="@{/js/naver-product-editor.js(v=1)}"></script></body></html>
