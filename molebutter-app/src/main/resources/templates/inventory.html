<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('재고')}"></head>
<body class="app-layout" th:attr="data-inventory-admin=${inventoryAdmin}">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>
<main id="main-content" tabindex="-1" class="page inventory-page">
    <h1>재고</h1>
    <p id="inventory-error" class="form-error" role="alert" hidden></p><p id="inventory-success" class="form-success" role="status" hidden></p>
    <section class="panel">
        <div class="inventory-heading inventory-table-heading">
            <nav class="tabs" aria-label="재고 업무"><button class="tab active" type="button" data-tab="items">보유 재고</button><button class="tab" type="button" data-tab="purchases">구매 주문</button><button class="tab" type="button" data-tab="movements">입출고 이력</button></nav>
            <button id="purchase-create" class="btn primary" type="button" th:if="${inventoryAdmin}">매입 주문 등록</button>
        </div>
        <p id="inventory-brand-error" class="form-error" role="alert" hidden></p>
        <form id="inventory-filter" class="toolbar">
            <div class="field inventory-search-field"><label id="inventory-query-label" for="inventory-q">상품코드·브랜드·검색어</label><input id="inventory-q" type="search" maxlength="255"></div>

            <div class="field inventory-brand-field"><label for="inventory-brand">브랜드</label><select id="inventory-brand" disabled><option value="">전체 브랜드</option><option value="UNASSIGNED">미지정</option></select></div>
            <div class="field inventory-size-field"><label for="inventory-size">페이지당 보기</label><select id="inventory-size"><option value="20">20개</option><option value="50">50개</option><option value="100" selected>100개</option></select></div><button class="btn primary">조회</button><button id="inventory-clear-product" class="btn" type="button" hidden>전체 상품 보기</button>
        </form>
        <p id="inventory-context" class="field-hint" role="status"></p>
        <div class="inventory-total list-summary" aria-live="polite"><span>총 보유 수량 <span id="inventory-total-quantity">—</span></span><span id="inventory-filtered-total" hidden></span></div>
        <div id="inventory-results" class="table-wrap" aria-live="polite"></div><div id="inventory-pager" class="pager"></div>
    </section>
</main>
<div th:replace="~{fragments/inventory-dialogs :: dialogs(${inventoryAdmin})}"></div>
<script defer th:src="@{/js/api.js}"></script><script defer th:src="@{/js/mall-tag.js}"></script><script defer th:src="@{/js/inventory.js}"></script>
</body></html>
