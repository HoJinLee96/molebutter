<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('쿠팡 상품 편집')}"></head>
<body class="app-layout">
<link rel="stylesheet" th:href="@{/css/coupang-product-editor.css(v=17)}">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>
<main id="main-content" tabindex="-1" class="page marketplace-editor coupang-product-form">
<div class="marketplace-editor-heading"><div><p id="editor-mode" class="product-meta"></p><h1 id="editor-title">쿠팡 상품 등록</h1></div><div class="common-draft-actions"><button id="editor-import-common" class="btn" type="button" hidden>공통 상품으로 가져오기</button><a class="btn" href="/marketplaces" data-editor-exit>목록</a></div></div>
<nav class="editor-section-nav" aria-label="상품 입력 구역">
<a href="#editor-basic">상품 정보</a><a href="#editor-option-table-section">옵션 목록</a><a href="#editor-media">이미지</a><a href="#editor-description">상세설명</a><a href="#editor-settings">상품주요정보</a><a href="#editor-documents">구비서류</a><a href="#editor-search-tags">검색어</a><a href="#editor-search-filters">검색필터</a><a href="#editor-notices">상품고시</a><a href="#editor-delivery">배송</a><a href="#editor-returns">반품·교환</a>
</nav>
<p id="editor-loading" role="status" hidden>상품과 현재 판매 정보 조회 중…</p>
<p id="editor-load-error" class="form-error" role="alert" hidden></p><button id="editor-retry" class="btn" type="button" hidden>다시 조회</button>
<form id="marketplace-editor-form" novalidate hidden>
<section id="editor-basic" class="panel editor-section coupang-form-section"><h2>상품 정보</h2><div id="editor-basic-fields"></div><div class="editor-category-controls"><button id="editor-category-load" type="button" class="btn">카테고리 규격 조회</button><span id="editor-category-status" role="status"></span></div></section>
<section id="editor-option-table-section" class="panel editor-section coupang-form-section"><div class="common-subheading"><h2>옵션 목록</h2><button id="editor-option-add" type="button" class="btn">옵션 추가</button></div><div id="editor-option-list"></div></section>
<div class="coupang-option-workspace"><div id="editor-option-tabs" class="coupang-option-tabs" role="tablist" aria-label="옵션별 정보"></div><div id="editor-option-panel" role="tabpanel">
<section id="editor-media" class="panel editor-section coupang-form-section"><h2>대표 이미지·추가 이미지</h2><div id="editor-media-fields"></div></section>
<section id="editor-description" class="panel editor-section coupang-form-section"><h2>상세설명</h2><div id="editor-description-fields"></div></section>
</div></div>
<section id="editor-settings" class="panel editor-section coupang-form-section"><h2>상품주요정보</h2><div id="editor-common-settings-fields"></div><div id="editor-settings-fields"></div></section>
<section id="editor-documents" class="panel editor-section coupang-form-section"><h2>구비서류</h2><div id="editor-document-fields"></div></section>
<section id="editor-search-tags" class="panel editor-section coupang-form-section"><h2>검색어</h2><div id="editor-search-tags-fields"></div></section>
<section id="editor-search-filters" class="panel editor-section coupang-form-section"><h2>검색필터</h2><div id="editor-search-filter-fields"></div></section>
<section id="editor-notices" class="panel editor-section coupang-form-section"><h2>상품정보제공고시</h2><div id="editor-notice-fields"></div></section>
<section id="editor-delivery" class="panel editor-section coupang-form-section"><h2>배송</h2><div id="editor-delivery-fields"></div></section>
<section id="editor-returns" class="panel editor-section coupang-form-section"><h2>반품·교환</h2><div id="editor-return-fields"></div></section>
<div id="editor-validation" role="status" tabindex="-1" hidden></div>
<div class="editor-actions"><button type="button" class="btn" data-editor-exit>취소</button><button type="button" class="btn" id="editor-registration-temporary" hidden>임시 저장</button><button type="submit" class="btn primary" id="editor-validate">저장</button></div>
</form><p id="editor-save-error" class="form-error" role="alert" hidden></p><section id="editor-save-results" class="panel" aria-live="polite" hidden></section></main>
<dialog id="editor-save-dialog" class="coupang-address-dialog" aria-labelledby="editor-save-title"><h2 id="editor-save-title">변경 내용 확인</h2><p id="editor-save-help">확인하면 표시된 요청을 차례로 전송합니다. 상품 정보는 저장 후 판매 승인을 요청합니다.</p><label id="editor-registration-approval" hidden><input type="checkbox" id="editor-registration-requested" checked>등록 후 판매 승인 요청</label><p id="editor-save-dialog-error" class="form-error" role="alert" hidden></p><div id="editor-save-preview"></div><div class="toolbar"><button type="button" id="editor-save-close" class="btn">취소</button><button type="button" id="editor-save-confirm" class="btn primary">쿠팡에 저장</button></div></dialog>
<dialog id="editor-address-dialog" aria-labelledby="editor-address-title" class="coupang-address-dialog"><div class="toolbar"><h2 id="editor-address-title">판매자 주소록</h2><button type="button" class="btn" data-address-close>닫기</button></div><div id="editor-address-list"></div><div class="toolbar"><button type="button" class="btn" id="editor-address-prev" disabled>이전</button><span id="editor-address-page"></span><button type="button" class="btn" id="editor-address-next" disabled>다음</button><button type="button" class="btn" id="editor-address-retry">다시 조회</button></div></dialog>
<script defer th:src="@{/js/api.js}"></script><script defer th:src="@{/js/marketplace-requests.js(v=2)}"></script><script defer th:src="@{/js/marketplace-editor-model.js(v=10)}"></script><script defer th:src="@{/js/coupang-brand-picker.js(v=2)}"></script><script defer th:src="@{/js/marketplace-submissions.js(v=3)}"></script><script defer th:src="@{/js/marketplace-editor-save.js(v=2)}"></script><script defer th:src="@{/js/coupang-product-registration.js(v=2)}"></script><script defer th:src="@{/js/marketplace-editor.js(v=22)}"></script>
</body></html>
