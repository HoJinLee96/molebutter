<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: common('판매 상품 편집')}"></head>
<body class="app-layout">
<link rel="stylesheet" th:href="@{/css/image-crop-editor.css(v=1)}">
<link rel="stylesheet" th:href="@{/css/r2-image-picker.css(v=3)}">
<link rel="stylesheet" th:href="@{/css/common-marketplace-editor.css(v=17)}">
<link rel="stylesheet" th:href="@{/css/coupang-product-editor.css(v=24)}">
<link rel="stylesheet" th:href="@{/css/naver-product-editor.css(v=3)}">
<header th:replace="~{fragments/header :: header(${userName}, ${menuItems})}"></header>
<main id="main-content" tabindex="-1" class="page marketplace-editor common-marketplace-editor" th:attr="data-editor-mode=${editorMode},data-editor-market=${editorMarket},data-editor-product-id=${editorProductId},data-editor-draft-id=${editorDraftId}">
<div class="marketplace-editor-heading"><div><h1 id="common-editor-title">상품 등록</h1></div><a class="btn" href="/marketplaces" data-common-exit>목록</a></div>
<div id="common-source" class="common-source" hidden></div>
<div id="common-link-actions" class="common-row" hidden><button type="button" class="btn" data-common-import>새 공통 상품으로 가져오기</button><button type="button" class="btn" data-common-link>기존 공통 상품에 연결</button></div>
<div id="common-view-tabs" class="common-tab-list" role="tablist" aria-label="편집 대상"></div>
<div id="common-live-state" class="common-live-state" aria-live="polite" hidden></div>
<div id="common-apply-panel" class="panel common-apply-panel" hidden><div class="common-subheading"><h2>공통값 적용</h2><button type="button" class="btn" id="common-apply">선택 항목 적용</button></div><div id="common-apply-targets" class="common-row"></div><div id="common-apply-fields" class="common-apply-fields"></div><p id="common-apply-error" class="form-error" role="alert" hidden></p></div>
<p id="common-loading" role="status" hidden>초안 조회 중…</p><p id="common-error" class="form-error" role="alert" hidden></p><button id="common-retry" type="button" class="btn" hidden>다시 조회</button>
<form id="common-editor-form" novalidate hidden>
<section id="common-basic" class="panel editor-section"><h2>기본 정보·옵션 판매</h2><div id="common-basic-fields"></div><div class="common-subheading"><h3>옵션·판매</h3><button id="common-option-add" type="button" class="btn small">옵션 추가</button></div><div id="common-option-fields"></div></section>
<section id="common-media" class="panel editor-section"><h2>이미지·상세설명</h2><label class="field editor-option-picker"><span>이미지·설명 적용 대상</span><select id="common-media-option"></select></label><div id="common-media-fields"></div></section>
<section id="common-notice" class="panel editor-section"><h2>상품고시 기본 정보</h2><div id="common-notice-fields"></div></section>
<section id="common-delivery" class="panel editor-section"><h2>배송·반품</h2><div id="common-delivery-fields"></div></section>
<section id="common-markets" class="panel editor-section"><h2>기타 설정</h2><div id="common-market-tabs" class="marketplace-tabs" role="tablist" aria-label="마켓별 입력" hidden></div><div id="common-market-fields"></div></section>
<section id="common-naver-controls" class="panel common-naver-controls" hidden></section>
<div id="common-naver-host" hidden></div>
<div id="common-lotteon-host" hidden></div><div id="common-elevenst-host" hidden></div><div id="common-validation" class="editor-validation" role="status" tabindex="-1" hidden></div>
<div class="editor-actions"><fieldset class="common-market-picker"><legend>이번 전송 대상</legend><div id="common-market-selection"></div></fieldset><div class="common-action-buttons"><button type="button" class="btn" data-common-exit>취소</button><button type="button" class="btn" id="common-validate">입력 검증</button><button type="button" class="btn" id="common-save">임시 저장</button><button type="button" class="btn primary" id="common-market-save">마켓에 저장</button></div></div>
</form>
<dialog id="common-link-dialog" class="common-submission-dialog" aria-labelledby="common-link-title"><div class="common-subheading"><h2 id="common-link-title">공통 상품 연결</h2><button type="button" class="btn" id="common-link-close">닫기</button></div><div id="common-link-content"></div><p id="common-link-error" role="alert" class="form-error" hidden></p><div class="common-submission-dialog-actions"><button type="button" class="btn" id="common-link-cancel">취소</button><button type="button" class="btn primary" id="common-link-confirm">연결 확정</button></div></dialog>
<p id="common-submission-error" role="alert" class="form-error" hidden></p>
<section id="common-submissions" class="panel editor-section" hidden><div class="common-subheading"><h2>마켓 전송 기록</h2><button type="button" class="btn small" id="common-submission-refresh">새로고침</button></div><div id="common-submission-list" aria-live="polite"></div><div class="pagination"><button type="button" class="btn small" id="common-submission-previous">이전</button><span id="common-submission-page"></span><button type="button" class="btn small" id="common-submission-next">다음</button></div></section>
<dialog id="common-submission-dialog" class="common-submission-dialog" aria-labelledby="common-submission-title"><div class="common-subheading"><h2 id="common-submission-title">마켓 전송 확인</h2><button type="button" class="btn" id="common-submission-dismiss">닫기</button></div><p id="common-submission-dialog-error" role="alert" class="form-error" hidden></p><div id="common-submission-preview"></div><div class="common-submission-dialog-actions"><button type="button" class="btn primary" id="common-submission-confirm">확인 후 전송</button></div></dialog>
</main>
<script defer th:src="@{/js/api.js}"></script><script defer th:src="@{/js/marketplace-common-settings.js(v=1)}"></script><script defer th:src="@{/js/r2-image-picker.js(v=4)}"></script><script defer th:src="@{/js/marketplace-requests.js(v=3)}"></script><script defer th:src="@{/js/coupang-product-form.js(v=1)}"></script><script defer th:src="@{/js/marketplace-editor-model.js(v=16)}"></script><script defer th:src="@{/js/coupang-brand-picker.js(v=3)}"></script><script defer th:src="@{/js/naver-brand-picker.js(v=1)}"></script><script defer th:src="@{/js/common-brand-picker.js(v=2)}"></script><script defer th:src="@{/js/common-category-picker.js(v=5)}"></script><script defer th:src="@{/js/common-address-picker.js(v=4)}"></script><script defer th:src="@{/js/naver-product-editor-model.js(v=2)}"></script><script defer th:src="@{/js/common-naver-editor-model.js(v=9)}"></script><script defer th:src="@{/js/image-crop-editor.js(v=1)}"></script><script defer th:src="@{/js/naver-product-form.js(v=9)}"></script><script defer th:src="@{/js/lotteon-editor-model.js(v=3)}"></script><script defer th:src="@{/js/lotteon-product-form.js(v=4)}"></script><script defer th:src="@{/js/elevenst-editor-model.js(v=4)}"></script><script defer th:src="@{/js/elevenst-product-form.js(v=2)}"></script><script defer th:src="@{/js/common-marketplace-editor-model.js(v=30)}"></script><script defer th:src="@{/js/marketplace-submissions.js(v=10)}"></script><script defer th:src="@{/js/common-marketplace-editor.js(v=49)}"></script>
</body></html>
