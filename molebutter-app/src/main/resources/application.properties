spring.application.name=molebutter
# 비밀 설정 로딩. 로컬은 classpath(src/main/resources/application-secret), 배포는 jar 옆 ./application-secret 디렉터리.
spring.config.import=optional:classpath:/application-secret/db.properties,optional:classpath:/application-secret/jwt.properties,optional:classpath:/application-secret/mail.properties,optional:classpath:/application-secret/admin.properties,optional:file:./application-secret/db.properties,optional:file:./application-secret/jwt.properties,optional:file:./application-secret/mail.properties,optional:file:./application-secret/admin.properties,optional:classpath:/application-secret/marketplace.properties,optional:file:./application-secret/marketplace.properties,optional:classpath:/application-secret/cloudflare.properties,optional:file:./application-secret/cloudflare.properties

# R2 공통 저장 인프라. 기존 파일 저장소의 전환과는 별개이며 명시적으로 활성화한다.
# 환경 변수의 읽기 쉬운 밑줄 이름을 지원하며 비밀값 자체는 설정에 기록하지 않는다.
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:false}
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}

server.port=8081

# 리버스 프록시(X-Forwarded-*) 뒤에서 실제 클라이언트 IP/프로토콜 복원. 내부망 프록시가 보낸 헤더만 신뢰한다.
server.forwarded-headers-strategy=native

# Spring Boot Configuration Processor

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/molebutter?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.flyway.url=${spring.datasource.url}
spring.flyway.clean-disabled=true
# 스키마는 Flyway(db/migration)가 관리한다. validate는 기동 시 엔티티-스키마 불일치를 즉시 드러내는 안전망.
spring.jpa.hibernate.ddl-auto=validate
# 뷰 렌더링까지 영속성 컨텍스트/커넥션을 붙잡는 OSIV 비활성화. 지연 로딩은 서비스 계층 안에서 끝낸다.
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Auth
# n번 로그인 실패시 계정 상태 Locked로 변경
auth.signin.max-failed-attempts=10
# n번 로그인 실패시 IP 차단
auth.signin.rate-limit-max-attempts=20
# 로그인 시도 rate limit 카운터 윈도우(TTL)
auth.signin.rate-limit-window=10m

# Jwt
# auth.jwt.secret=
auth.jwt.access-ttl=15m
auth.jwt.refresh-ttl=14d
auth.jwt.issuer=molebutter

#Cookie
auth.cookie.access-name=access_token
auth.cookie.refresh-name=refresh_token
auth.cookie.refresh-path=/api/auth
auth.cookie.secure=false

# 가입 이메일 인증
auth.email-verification.code-ttl=5m
auth.email-verification.verified-ttl=30m
auth.email-verification.send-cooldown=60s
auth.email-verification.max-verify-attempts=5

# Mail
# 메일 발송 구현 선택. 새 구현을 추가하면 전용 @Configuration에 @ConditionalOnProperty를 걸고 이 값만 바꾼다.
mail.provider=resend

# Logging
# 저장·회전·삭제 정책은 logback-spring.xml에서 관리한다.

# 상품 최신화: 비로그인 전용 Chrome 창 1개에서 네이버 화면을 직접 조작한다.
product.search.chrome-executable=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome
product.search.delay-ms=3000
product.search.ui-stabilization-ms=2000
product.refresh.worker-enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# 개인/기존 로그인 프로필을 사용하지 않는다. 전용 경로: ./data/product-search-guest
# 창은 항상 표시하며, 로그인 요청과 로그인 상태에서의 가격 검색을 차단한다.

# 쿠팡 인증값은 기존 application-secret/marketplace.properties에서 읽는다.
# coupang_access_id는 vendorId이며 키는 브라우저에 전달하지 않는다.
coupang.vendor-id=${coupang_access_id:}
# 업체코드와 별개인 Wing 로그인 ID. 신규 상품 등록 시 서버에서만 적용한다.
coupang.vendor-user-id=${COUPANG_VENDOR_USER_ID:${coupang_vendor_user_id:}}
coupang.access-key=${coupang_access_key:}
coupang.secret-key=${coupang_secret_key:}



# Order day-mode return/cancel contract verified by read-only runtime calls on 2026-10-07.
# Disable if a later contract probe fails; evidence contains only status/code/counts.
coupang.orders.claims-verified=true
coupang.orders.claims-verification-reference=docs/coupang-api/sales-orders.md#실제-계정-읽기-검증

# Private Coupang working-copy images; back up this directory together with the database.
coupang.assets.directory=./data/coupang-assets
# Public HTTPS origin for images explicitly selected for coupang delivery. Empty disables local-image delivery.
coupang.assets.public-base-url=${COUPANG_PUBLIC_IMAGE_BASE_URL:https://molebutter.link}
