# HTTPS를 종료하는 신뢰할 수 있는 리버스 프록시 뒤에서 사용한다.
auth.cookie.secure=true
app.security.require-https=true
server.forwarded-headers-strategy=native
# 외부 프록시가 있다면 신뢰할 IP만 지정. 클라이언트 직접 접근은 차단한다.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:127\\.0\\.0\\.1|::1}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
auth.jwt.secret=${JWT_SECRET}
resend.api-key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
server.error.include-message=never
server.error.include-stacktrace=never
