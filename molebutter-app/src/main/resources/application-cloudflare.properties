# Cloudflare Tunnel terminates public HTTPS and forwards HTTP over loopback.
# Add the cloudflare profile only when the local cloudflared connector is running.
server.address=127.0.0.1
auth.cookie.secure=true
app.security.require-https=true
server.forwarded-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.0\\.0\\.1|::1

# Resend credentials and sender continue to load from the existing mail configuration.

# The public Cloudflare deployment uses the configured R2 buckets for explicit image uploads.
# Credentials remain in the imported secret configuration; other profiles keep R2 disabled.
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:true}
